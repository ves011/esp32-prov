<script>
/*
update file flow
1. client 2 server		UPD_FILE_REQ\1file-IDX\1file-size\1#chunks\1
2. server 2 client		SEND_FILE\1file-IDX
3. client 2 server		FILE_CHUNK\1file-IDX\1#chunk\1#length\1
	#3 repeats until sum(chunk size) = legnth
4. server 2 client		UPDATE_FILE\1file-IDX\1error code\1error string
*/
const UPD_FILE_REQ	= "update file req";
const SEND_FILE		= "send file";
const FILE_CHUNK	= "file chunk";
const UPDATE_FILE	= "update file";

/*
create file flow
1. client 2 server		CREATE_FILE_REQ\1file-name\1
2. server 2 client		CREATE_FILE\1error code\1error string
*/
const CREATE_FILE_REQ	= "update file req";
const CREATE_FILE		= "update file";

var c_connected = false;
var websocket  = null;
var updid = [];
const chunk_size = 512;
function pageload()
    {
    var inp = document.getElementsByClassName("sed");
    for (i = 0; i < inp.length; i++)
        {
        inp[i].addEventListener("beforeinput", handleKeys, false);
        inp[i].addEventListener("input", updatelen, false);
        }
    var cf = document.getElementById("fname");
    if(cf)
        cf.addEventListener("input", enable_create, false);
    enable_create();
    
    const wsUri = window.location.origin + "/ws";
	websocket = new WebSocket(wsUri);
	websocket.addEventListener("open", () => {console.log("CONNECTED"); c_connected = true;});
	websocket.addEventListener("close", (event) => {console.log("DISCONNECTED: " + event.data); c_connected = false;});
	websocket.onmessage = (msg) => {ws_receive(msg);};
    
    }
function ws_receive(msg)
    {
    console.log('RECEIVED:', msg.data);
    var params = msg.data.split('\x01');
    if(params[0] == CREATE_FILE)
        {
        if(params[1] == "ESP_OK")
            location.reload();
        else
            alert("error creatingfile\n" + params[1] + "\n" + "errno = " + params[2]);
        }
    else if(params[0] == SEND_FILE)
        {
        if(params.length >=2 && updid.length == 1 && params[1] == updid[0])
            {
            var pos = 0, l = 0, n = 0;
            var b = document.getElementById("ta-" + params[1]).value;
            while(pos < b.len)
                {
                if(pos + chunk_size < b.length)
                    l = chunk_size;
                else 
                    l = b.length - pos;
                var buf1 = FILE_CHUNK + "\0x1" + params[1] + "\0x1" + n + "\0x1" + l + "\0x1";
                var buf = buf1 + b.substring(pos, pos + l);
                ws_send(buf);
                pos += l;
                n++;
                }
            }
        }
    }
function ws_send(msg)
	{
	if(websocket.readyState == WebSocket.OPEN)
		websocket.send(msg);
	else
		alert("not connected to websocket server");
	}
function handleKeys(e) 
    {
    if(document.getElementById("commit_ch").disabled == true ||
        (updid.length == 1 && updid[0] == e.target.id)) //only 1 file at a time allowed to be updated
        {
        this.style.color = "rgb(255, 0, 0)";
        document.getElementById("commit_ch").disabled = false; 
        pushupdate(e.target.id);     
        }
    else {e.stopPropagation(); e.preventDefault();}
    }
function pushupdate(id)
    {
    var idn = id.split("-");
    for(i = 0; i < updid.length; i++)
        {
        if(updid[i] == idn[1])
            break;
        }
    if(i == updid.length)
        updid.push(idn);
    }
function updatelen(e) 
    {
    var target = e.target;
    var l = target.value.length;
    var id = e.target.id.split("-");
    var idel = "size-" + id[1];
    document.getElementById(idel).innerHTML = l; 
    }
function enable_create()
    {
    var fn = document.getElementById("fname").value;
    if(fn.length)
        document.getElementById("crfile").disabled = false;
    else
        document.getElementById("crfile").disabled = true;
    }
function create_file()
    {
    var fname = document.getElementById("fname").value;
    if(fname.length)
        {
        var wsmsg = CREATE_FILE_REQ + "\1" + fname + "\1";
        ws_send(wsmsg);
        }
    }
function save_changes()
    {
    for(i = 0; i < updid.length; i++)
        {
        var size = Number(document.getElementById("size-" + updid[i]).innerHTML);
        if(size == null)
            continue;
        var nr_chunks = size >> 9;
        if(nr_chunks == 0) 
            nr_chunks++;
        var msg = UPD_FILE_REQ + '\x01' + updid[i] + '\0x1'+ size + '\0x1' + nr_chunks + '\0x1';
        ws_send(msg);        
        }
    }
</script>
